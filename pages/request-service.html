<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Request Service | LocalHelp</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<nav class="navbar navbar-light bg-white shadow-sm">

<div class="container">

<a
class="navbar-brand fw-bold text-primary"
href="../index.html">

LocalHelp

</a>

<a
href="providers.html"
class="btn btn-outline-primary">

Find Providers

</a>

</div>

</nav>


<section class="section section-light">

<div class="container">

<div class="row justify-content-center">

<div class="col-12 col-lg-8">

<div class="custom-card">

<h1>Request a Service</h1>

<p class="text-muted-custom">
Tell us what help you need.
</p>


<form id="requestForm">


<div class="mb-3">

<label class="form-label">
Service
</label>

<select
id="requestService"
class="form-control"
required>

<option value="">
Select service
</option>

<option>Electrician</option>
<option>Plumber</option>
<option>Carpenter</option>
<option>Cleaner</option>
<option>Computer Repair</option>

</select>

</div>


<div class="mb-3">

<label class="form-label">
Problem Description
</label>

<textarea
id="requestDescription"
class="form-control"
rows="4"
placeholder="Describe the problem..."
required></textarea>

</div>


<div class="mb-3">

<label class="form-label">
Location
</label>

<input
type="text"
id="requestLocation"
class="form-control"
placeholder="Enter your location"
required>

</div>


<div class="mb-3">

<label class="form-label">
Preferred Date
</label>

<input
type="date"
id="requestDate"
class="form-control"
required>

</div>


<div id="requestMessage"></div>


<button
type="submit"
class="btn-custom">

Submit Service Request

</button>

</form>

</div>

</div>

</div>

</div>

</section>


<script>

const requestForm =
document.getElementById("requestForm");

requestForm.addEventListener(
"submit",
function(event) {

event.preventDefault();

document.getElementById(
"requestMessage"
).innerHTML =

'<div class="alert alert-success mt-3">Service request created successfully! Backend processing will be implemented in Phase II.</div>';

});

</script>

</body>

</html>
