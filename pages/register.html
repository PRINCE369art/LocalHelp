<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Register | LocalHelp</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<nav class="navbar navbar-light bg-white shadow-sm">

<div class="container">

<a
class="navbar-brand fw-bold text-primary"
href="../index.html">

LocalHelp

</a>

<a
href="login.html"
class="btn btn-outline-primary">

Login

</a>

</div>

</nav>


<section class="section section-light">

<div class="container">

<div class="row justify-content-center">

<div class="col-12 col-md-7 col-lg-6">

<div class="custom-card">

<div class="text-center mb-4">

<h1>Create Account</h1>

<p class="text-muted-custom">
Join the LocalHelp community
</p>

</div>


<form id="registerForm">


<div class="mb-3">

<label class="form-label">
Full Name
</label>

<input
type="text"
id="registerName"
class="form-control"
placeholder="Your full name"
required>

</div>


<div class="mb-3">

<label class="form-label">
Email Address
</label>

<input
type="email"
id="registerEmail"
class="form-control"
placeholder="you@example.com"
required>

</div>


<div class="mb-3">

<label class="form-label">
Phone Number
</label>

<input
type="tel"
id="registerPhone"
class="form-control"
placeholder="10 digit phone number"
required>

</div>


<div class="mb-3">

<label class="form-label">
I want to join as
</label>

<select
id="registerRole"
class="form-control"
required>

<option value="">
Select your role
</option>

<option value="customer">
Customer
</option>

<option value="provider">
Service Provider
</option>

</select>

</div>


<div class="mb-3">

<label class="form-label">
Password
</label>

<input
type="password"
id="registerPassword"
class="form-control"
placeholder="Minimum 6 characters"
required>

</div>


<div id="registerMessage"></div>


<button
type="submit"
class="btn-custom w-100 mt-3">

Create Account

</button>


</form>

</div>

</div>

</div>

</div>

</section>


<footer class="bg-dark text-light py-4">

<div class="container text-center">

<h5>LocalHelp</h5>

<p class="text-secondary mb-0">
Find. Connect. Get It Done.
</p>

</div>

</footer>


<script src="../js/auth.js"></script>

</body>

</html>
